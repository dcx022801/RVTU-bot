services:
  rvtu-bot:
    image: ghcr.io/dcx022801/rvtu-bot:latest   # 已发布镜像，docker compose pull 直接拉取
    build: .                                   # 也可本地构建（up -d --build）
    container_name: rvtu-bot
    # host 网络：直读宿主机网口/网关信息，Portal 认证才能探测真实接口
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    env_file:
      # .env 注入（可选）：存在 .env 且填了 CREDS_USER 时启用，全部配置以 .env 为准
      - path: .env
        required: false
    volumes:
      # 配置目录：默认工程内 ./config；可用环境变量 CONFIG_DIR 指向别处
      - ${CONFIG_DIR:-./config}:/config
      - ./defaults:/defaults   # 程序参数（调度/探测点/接口地址，可改）
      - ./state:/state         # 运行态（登录态/基线/日志，自动生成）
