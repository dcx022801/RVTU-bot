name: rvtu-bot

services:
  rvtu-bot:
    # 生产建议用 digest 固定：可在 shell 设置 RVTU_IMAGE=ghcr.io/...@sha256:<digest>
    image: ${RVTU_IMAGE:-ghcr.io/dcx022801/rvtu-bot:latest}
    # 构建上下文是仓库根目录（本文件位于 docker/）
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rvtu-bot
    # host 网络：Portal 认证需要直读宿主机网口；Web 管理页监听 11451
    network_mode: host
    restart: unless-stopped
    init: true                                 # 回收子进程
    environment:
      TZ: Asia/Shanghai
      STATE_DIR: /state
      RVTU_STATE_DIR: /state
      RVTU_USERS_DIR: /state/users
      RVTU_TEMPLATE_DIR: /defaults/user-template
      RVTU_WEB_PORT: "11451"
      # 旧版配置仅用于首次迁移：/state/config（旧 .env 输出）优先，其次 /config（挂载）
      RVTU_LEGACY_CONFIG_DIRS: "/state/config;/config"
    volumes:
      # 旧配置只读挂载；首次启动会迁移为 default 用户，之后由 Web 管理
      - ${CONFIG_DIR:-../config}:/config:ro
      - ../defaults:/defaults:ro   # 程序参数 + 新用户模板（可改）
      - ../state:/state            # ★ 持久化：管理员哈希、用户/凭据、会话、日志、调度状态
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 仅入口脚本用于 chown + su-exec 降权；业务进程以 rvtu 运行
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
